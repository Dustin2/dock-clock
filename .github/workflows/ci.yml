name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

# Cancel an older run when new commits land on the same branch or PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle dependencies and validates the wrapper jar.
      - uses: gradle/actions/setup-gradle@v5

      - name: Lint, test and build
        run: ./gradlew ktlintCheck detekt testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: dockclock-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: app/build/reports/
