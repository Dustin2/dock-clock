name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Needed to create the GitHub release.
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # A tag that doesn't match versionName would publish an APK with the wrong version.
      - name: Check tag matches versionName
        run: grep -q "versionName = \"${TAG#v}\"" app/build.gradle.kts

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DOCKCLOCK_KEYSTORE_BASE64 }}
        run: |
          # Fail instead of silently signing with the debug key.
          test -n "$KEYSTORE_BASE64" || { echo "Missing DOCKCLOCK_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          DOCKCLOCK_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          DOCKCLOCK_KEYSTORE_PASSWORD: ${{ secrets.DOCKCLOCK_KEYSTORE_PASSWORD }}
          DOCKCLOCK_KEY_ALIAS: ${{ secrets.DOCKCLOCK_KEY_ALIAS }}
          DOCKCLOCK_KEY_PASSWORD: ${{ secrets.DOCKCLOCK_KEY_PASSWORD }}
        run: |
          ./gradlew testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "dockclock-$TAG.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "dockclock-$TAG.apk" --title "DockClock $TAG" --generate-notes --verify-tag
